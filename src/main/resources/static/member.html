<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<title>FitBook-會員</title>
		<script>
		window.addEventListener('DOMContentLoaded', () => {
			fetch('/api/user',{
				credentials:'include'})			
			    .then(response => {
			        if (!response.ok) {
			            window.location.href = '/login.html';
			            return;
			        }
			        return response.json();
			    })
			    .then(user => {
			        if (user) {
			            document.getElementById('loginName').textContent = user.name;
			        }
			    })
			    .catch(error => {
			        console.error('取得登入者資料失敗：', error);
			    });
		})
		</script>
		<style>
		h1 {background-color: orange;}	
		
		</style>
		
	</head>
	<body>
		<h1>學員，<span id="loginName"></span>您好！</h1>
			<br>
		<form action="/logout" method="POST">
		    <button type="submit">登出系統</button>
		</form>

	</body>
</html>
