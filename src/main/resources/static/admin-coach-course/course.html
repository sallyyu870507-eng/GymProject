<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POWER GYM</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="container-fluid">
        <div class="row min-vh-100">

            <!-- 左側導覽 -->
            <aside class="col-md-3 col-lg-2 bg-dark text-white p-4">
                <h2 class="h4 fw-bold mb-4 d-flex align-items-center gap-2">
                    <i class="bi bi-activity" aria-hidden="true"></i>
                    <span>GYM CRM</span>
                </h2>

                <nav class="nav flex-column gap-2">
                    <a class="nav-link text-white bg-secondary rounded" href="course.html">課程管理</a>
                    <a class="nav-link text-white" href="coach.html">教練管理</a>
                </nav>
            </aside>

            <!-- 右側內容 -->
            <main class="col-md-9 col-lg-10 bg-light p-4">
                <h1 class="h3 fw-bold mb-4">課程管理</h1>

                <div class="card">
                    <div class="card-body">
                        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3">
                            <h2 class="h5 fw-bold mb-0">課程列表</h2>
                            <div class="d-flex flex-wrap align-items-center gap-2">
                                <input id="courseSearch" type="search" class="form-control"
                                    style="width: 260px; max-width: 100%;" placeholder="輸入欲查詢的關鍵字" aria-label="搜尋課程">
                                <button type="button" class="btn btn-dark text-nowrap" id="addCourseBtn">
                                    ＋ 新增課程
                                </button>
                            </div>
                        </div>

                        <div class="table-responsive">
                            <table class="table table-hover align-middle">
                                <thead class="table-light">
                                    <tr>
                                        <th>課程編號</th>
                                        <th>課程名稱</th>
                                        <th>類型</th>
                                        <th>說明</th>
                                        <th>時長</th>
                                        <th>價格</th>
                                        <th>授課教練</th>
                                        <th>狀態</th>
                                        <th>操作</th>
                                    </tr>
                                </thead>
                                <tbody id="courseTableBody">
                                    <!-- main.js 會把資料放進這裡 -->
                                </tbody>
                            </table>
                        </div>

                    </div>
                </div>
            </main>

        </div>
    </div>
    <!-- 新增／編輯課程共用同一個視窗 -->
    <div class="modal fade" id="courseModal" tabindex="-1" aria-labelledby="courseModalTitle" aria-hidden="true">
        <div class="modal-dialog">
            <form class="modal-content" id="courseForm">
                <div class="modal-header">
                    <h2 class="modal-title fs-5" id="courseModalTitle">新增課程</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="關閉"></button>
                </div>

                <div class="modal-body">
                    <div class="mb-3">
                        <label for="courseName" class="form-label">課程名稱</label>
                        <input id="courseName" class="form-control" required maxlength="100">
                    </div>

                    <div class="mb-3">
                        <label for="courseType" class="form-label">課程類型</label>
                        <select id="courseType" class="form-select">
                            <option>重量訓練</option>
                            <option>伸展放鬆</option>
                            <option>懸吊訓練</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="courseDescription" class="form-label">課程說明</label>
                        <textarea id="courseDescription" class="form-control" rows="3" maxlength="500"></textarea>
                    </div>

                    <div class="mb-3">
                        <label for="coursePrice" class="form-label">價格</label>
                        <input id="coursePrice" class="form-control" type="number" min="0" max="99999999.99" step="0.01"
                            required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">授課教練（可選多位）</label>
                        <div id="courseCoachOptions"></div>
                    </div>

                    <!-- 只有編輯時才顯示 -->
                    <div class="mb-3" id="courseStatusGroup" hidden>
                        <label for="courseStatus" class="form-label">課程狀態</label>
                        <select id="courseStatus" class="form-select">
                            <option value="active">上架</option>
                            <option value="inactive">下架</option>
                        </select>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="submit" class="btn btn-dark">儲存</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/data.js"></script>
    <script src="js/main.js?v=20261019-1551"></script>
</body>

</html>
