<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<title>FitBook-管理員</title>
		<style>
			.inactive-member td:not(:last-child) {
			    text-decoration: line-through;
			    color: rgb(128, 128, 128);
				background-color: rgb(236, 236, 236);
			}
		</style>
		<script>
	//取得登入者名稱
		window.addEventListener('DOMContentLoaded', () => {
			fetch('/api/user',
			{credentials:'include'
			})	
			    .then(response => {
			        if (!response.ok) {
			            window.location.href = '/login.html';
			            return;
			        }
			        return response.json();
			    })
			    .then(user => {
			        if (user) {
			            document.getElementById('loginName').textContent = user.name;
			        }
			    })
			    .catch(error => {
			        console.error('取得登入者資料失敗：', error);
			    });
});


//----
		document.addEventListener("DOMContentLoaded", () => {
		    loadMember();
		});


		
		window.addEventListener("DOMContentLoaded", ()=>{
			const dialog = document.getElementById("registerDialog");
			const openRegisterBtn = document.getElementById("openRegisterBtn");
			const closeRegisterBtn = document.getElementById("closeRegisterBtn");
			openRegisterBtn.addEventListener("click", () => {
				console.log('新增會員');
				//清空上一筆資料
				document.getElementById("registerForm").reset();
				//清空上一筆錯誤訊息
				document.getElementById("registerMessage").textContent = "";
			    dialog.showModal();
				
			});
		
			closeRegisterBtn.addEventListener("click", () => {
			    dialog.close();
			});
			
		});
		
				//新增會員的POST			
		window.addEventListener("DOMContentLoaded", ()=>{
			
			document.getElementById("submitRegisterBtn")
						.addEventListener("click", async function () {

						    const data = {
						        username: document.getElementById("username").value,
						        password: document.getElementById("password").value,
						        name: document.getElementById("name").value,
								gender: document.querySelector(
								    'input[name="gender"]:checked')?.value ?? "",
						        phone: document.getElementById("phone").value,
						        email: document.getElementById("email").value,
								birthday: document.getElementById("birthday").value || null
						    };
							if (/\s/.test(data.password)) {
							    alert("密碼不能包含空白字元！");
							    return false;
							}

							try{
								console.log("送出表單");
								const response = await fetch("/api/admin/members", {
						        method: "POST",
						        headers: {
						            "Content-Type": "application/json"
						        },
						        body: JSON.stringify(data)
							});
							
							const result = await response.json()
							if (response.status === 401) { //沒session或過期
							    window.location.href = "/login.html";
							    return;
							}

							if (response.status === 403) {
							    alert("沒有新增會員的權限");
							    return;
							}
						
							if (response.status === 400) {
								//這裡的result長相 :{ success: false, errors: {...} }
								//console.log("後端回傳的400結構:" , result);
								
								const errorMessages = Object.values(result.errors ?? {});
								//如果有error就執行errorMessage，沒有error就執行resultMessage
								const message = errorMessages.length > 0
								    ? errorMessages.join("、")
								    : (result.message ?? "資料格式錯誤");

								document.getElementById("registerMessage")
								    .textContent = message;
								return;
								}
								
								//console.log("HTTP狀態代碼" + response.status);

								if (response.ok) {
									
									const dialog = document.getElementById("registerDialog");
								    dialog.close();
									alert("新增會員成功");

								    // 重新取得會員列表
								  loadMember();	
							}else{
								document.getElementById("registerMessage").textContent = result.message || "伺服器發生異常，請聯絡管理員";

							}		
								}catch (error) {
								        console.error("新增會員發生錯誤：", error);
			
								        document.getElementById("registerMessage")
								            .textContent = "系統發生錯誤，請稍後再試";
								    }
				});
	});

		window.addEventListener("DOMContentLoaded", ()=>{
			document.getElementById("searchBtn")
			.addEventListener("click", () => {

			    loadMember(0);

			});
			//再輸入框按enter也可以觸發
			document.getElementById("memberSearch")
			.addEventListener("keydown", (event) => {

			    if (event.key === "Enter") {
			        loadMember(0);
			    }

			});
			document.getElementById("reset")
			.addEventListener("click", () => {
			
			    document.getElementById("statusFilter").value = "active";
				document.getElementById("memberSearch").value = ""
			    loadMember(0);

			});
	
		});
	
	
		</script>
		
		<style>
		h1 {background-color:  lightgray;}	
		
		</style>
		
	</head>
	<body>
		<h1><span id="loginName"></span>您好！</h1>
		<br>
		<form action="/logout" method="POST">
		    <button type="submit">登出系統</button>
		</form>
<hr/>
		<button id="openRegisterBtn">新增會員</button>
		<button id="reset">重新載入</button>
		
		<input
		    type="text"
		    id="memberSearch"
		    placeholder="請輸入會員姓名"
		>
		<button id="searchBtn">搜尋</button>
		
		<select id="statusFilter">
		    <option value="all">全部會員</option>
		    <option value="active" selected>啟用中</option>
		    <option value="inactive">已停用</option>
		</select>
		<dialog id="registerDialog">
		    <form id="registerForm">
		        <h2>新增會員</h2>

		        帳號:<input type="text" id="username" placeholder="帳號" pattern="[A-Za-z0-9]{4,20}" title="帳號必須為4~20位英文字母或數字" required>
		        密碼:<input type="password" id="password" placeholder="密碼" required pattern="^\S{4,}$" title="密碼最少四字元且不能有空白">
		        姓名:<input type="text" id="name" placeholder="姓名" required>
				性別:
				<label for="male"><input type="radio" id="male" name="gender" value="male" required>男</label>
				<label for="female"><input type="radio" id="female" name="gender" value="female" required>女</label>
		        電話:<input type="tel" id="phone" placeholder="電話" required>
		        電子信箱:<input type="email" id="email" placeholder="Email" required>
				生日:<input type="date" id="birthday" placeholder="生日" required>


		        <button type="button" id="submitRegisterBtn">送出</button>
		        <button type="button" id="closeRegisterBtn">取消</button>

		        <p style="color: red;" id="registerMessage"></p>
		    </form>
		</dialog>
		<!-- 新增購課彈窗 -->
		<dialog id="purchaseDialog">

		    <h2>新增會員購課</h2>

		    <p>
		        購課會員：
		        <strong id="purchaseMemberName"></strong>
		    </p>

		    <!-- 選擇課程 -->
		    <div>
		        <label for="purchaseCourse">選擇課程：</label>

		        <select id="purchaseCourse" required>
		            <option value="">請選擇課程</option>
		        </select>
		    </div>

		    <br>

		    <!-- 選擇教練 -->
		    <div>
		        <label for="purchaseCoach">選擇教練：</label>

		        <select id="purchaseCoach" disabled required>
		            <option value="">請先選擇課程</option>
		        </select>
		    </div>

		    <hr>

		    <p>
		        單堂價格：
		        <span id="purchaseUnitPrice">NT$ 0</span>
		    </p>

		    <p>購買堂數：10 堂（固定）</p>

		    <h3>
		        購買總金額：
		        <span id="purchaseTotalAmount">NT$ 0</span>
		    </h3>

		    <p id="purchaseMessage" style="color: red;"></p>

		    <button type="button" id="submitPurchaseBtn">
		        確認購課
		    </button>

		    <button type="button" id="closePurchaseBtn">
		        取消
		    </button>

		</dialog>
		
		<br/><br/>
		<div id="editMemberPanel" style="display: none;">

		    <h3>編輯會員</h3>

		    <label>帳號</label>
		    <input type="text" id="editUserName">
			
		    <label>姓名</label>
		    <input type="text" id="editName">

		    <label>電話</label>
		    <input type="tel" id="editPhone">

		    <label>Email</label>
		    <input type="email" id="editEmail">

		    <p id="editError" style="color: red;"></p>

		    <button type="button" id="saveEdit">
		        儲存修改
		    </button>

		    <button type="button" id="cancelEdit">
		        取消
		    </button>

		</div>
		<table style="width: 100%;">
		    <thead>
		        <tr>
		            <th>會員編號</th>
		            <th>姓名</th>
		            <th>性別</th>
		            <th>電話</th>
		            <th>課程剩餘堂數</th>
		            <th>操作</th>
		        </tr>
		    </thead>

		    <tbody id="memberTableBody"></tbody>
		</table>

		<div>
		    <button id="prevPageBtn"> <!--呼叫換頁功能-->
		        上一頁
		    </button>

		    <span id="pageInfo"></span>

		    <button id="nextPageBtn">
		        下一頁
		    </button>
		</div>
	
		
		<script>		
		
	
		//---------------------
		document.getElementById("statusFilter")
		.addEventListener("change", function() {
		    loadMember(0);
		});
//已登入但沒權限的帳號會被拒絕然後拋出權限代碼給前端
//會員清單載入功能

//先在全域給予預設值，讓所有功能都能存取
	let currentPage = 0;
	let totalPages = 0;
	const pageSize = 10;
	
	async function loadMember(page = 0){
		
		try {
			const status =
			    document.getElementById("statusFilter").value;
			const keyword =
				document.getElementById("memberSearch").value.trim();
		//用URLSearchParams建立可操作的參數，會自動轉換文字編碼!!
			const params = new URLSearchParams({
			    page: page,
			    size: pageSize,
			    status: status,
			    keyword: keyword
			});
			const response = await fetch(
			    `/api/admin/members?${params.toString()}`
		);
		
		if (response.status === 401) { //沒登入
		                window.location.href = '/login.html';
		                return;
           	}
        if (response.status === 403) { //有登入但沒權限被forbidden
                alert('沒有權限'); 
				//呼叫api/user找出role,送使用者去該去的頁面
				const userResponse = await fetch("/api/user");

				if (!userResponse.ok) {
				    window.location.href = "/login.html";
				    return;
				}

				const user = await userResponse.json();

				switch (user.role) {
				    case "admin":
				        window.location.href = "/admin.html";
				        break;

				    case "coach":
				        window.location.href = "/coach.html";
				        break;

				    case "member":
				        window.location.href = "/member.html";
				        break;

				    default:
				        window.location.href = "/login.html";
				}
				return;
            }

            if (!response.ok) {
				const errorText = await response.text();
				console.log("HTTP狀態:"+response.status);
				console.log("後端內容:"+ errorText);
                throw new Error(`HTTP錯誤：${response.status}`);
            }
					
		const data = await response.json();
		console.log(data); //將後端傳回來的response拿出來看
		const members = data.members;
		document.getElementById("memberTableBody").innerText=""; //帶入前先清空
		
		//用迴圈一筆一筆寫入
		members.forEach(member=>{
			const tr = document.createElement("tr");
			
			const memberNoTd = document.createElement("td");
			memberNoTd.textContent = member.memberno;
			const nameTd = document.createElement("td");
			nameTd.textContent = member.name;
			const genderTd = document.createElement("td");
			genderTd.textContent = member.gender;
			const phoneTd = document.createElement("td");
			phoneTd.textContent = member.phone;
			//套用CSS篩選器
			if (member.status === "inactive") {
			    tr.classList.add("inactive-member");
			}
			const coursesTd = document.createElement("td");
			
			if (member.courses.length === 0){
				coursesTd.textContent = "無課程";
			}else{
				//課程是第二層物件
				member.courses.forEach(course=>{
					const div = document.createElement("div");
					
					div.textContent = `${course.coursename} : ${course.remainingsessions}堂 |`;
					coursesTd.appendChild(div);
				});
			}
			const actionTd = document.createElement("td");		
			
			const editBtn = document.createElement("button");
			editBtn.textContent = "查看/編輯";
			editBtn.type = "button";
			editBtn.addEventListener("click", () => {
			    editMember(member.memberid); //綁訂每個會員的編輯按鈕都是跟著自己的memberid
			});
			
			const statusBtn = document.createElement("button");
			statusBtn.textContent = member.status === "inactive" ? "恢復":"停用";
			//	const renewBtn = document.createElement("button");
			//	renewBtn.textContent = "購課";
							
			const purchaseBtn = document.createElement("button");
			purchaseBtn.textContent = "購課";
			purchaseBtn.type = "button";
			purchaseBtn.disabled = member.status?.trim() !== "active";
			purchaseBtn.addEventListener("click", () => {
			    openPurchaseDialog(member.memberid, member.name);
			});
			//在操作區加入按鈕
			actionTd.append(editBtn, 
							statusBtn,
							purchaseBtn
					);
			
			// 將所有 td 加入 tr
			        tr.append(
			            memberNoTd,
			            nameTd,
			            genderTd,
			            phoneTd,
			            coursesTd,
			            actionTd
			        );
			
			editBtn.addEventListener("click", () => {
				    console.log("編輯會員 ID：" + member.memberid);
				    // 這邊再加入編輯的按鈕設定
				    // openEditMember(member.memberid);
			});
				statusBtn.addEventListener("click", () => {
					console.log("操作會員 ID：" + member.accountid);
					if (member.status === "inactive") {
					    reactivateMember(member.accountid);
					} else {
						deleteMember(member.accountid);
				}
				});
				const tbody = document.getElementById('memberTableBody');
			        // 將 tr 加入 tbody
			        tbody.appendChild(tr);
			    });
				
			


			    // 9. 更新分頁資訊
			    currentPage = data.currentPage;  //0為第一頁
			    totalPages = data.totalPages;

			    document.getElementById("pageInfo").textContent =
			        `第 ${currentPage + 1} / ${totalPages} 頁`;

			    document.getElementById("prevPageBtn").disabled =
			        !data.hasPrev;  //本身從controller傳回來的就是boolean值

			    document.getElementById("nextPageBtn").disabled =
			        !data.hasNext;

			} catch (error) {

			    console.error("載入會員失敗：", error);
			    alert("會員資料載入失敗");
			}
}
			
	//換頁功能，讓上下頁按鈕呼叫
			function changePage(direction){
			//console.log('changePage');
			const newPage = currentPage + direction;
			
			if(newPage<0 || newPage >= totalPages){
				return;
			}
			loadMember(newPage);
		}
			
			document.getElementById('prevPageBtn')
			.addEventListener("click", ()=>{
					changePage(-1);
			});
			document.getElementById('nextPageBtn')
			.addEventListener("click", ()=>{
					changePage(1);
			});
//停用會員功能按鈕
			async function deleteMember(accountid) {

			    // 先詢問管理員是否確定停用
			    if (!confirm("確定要停用這位會員嗎？")) {
			        return;
			    }

			    try {
			        const response = await fetch(
			            `/api/admin/members/del/${accountid}`,
			            {
			                method: "DELETE"
			            }
			        );

			        // 401Session 過期或未登入
			        if (response.status === 401) {
			            //alert("登入已過期，請重新登入");
			            window.location.href = "/login.html";
			            return;
			        }

			        // 403權限不足
			        if (response.status === 403) {
			            alert("沒有停用會員的權限");
			            return;
			        }

			        // 成功
			        if (response.ok) {
			            alert("帳號停用成功");

			            // 重新取得會員列表
			            loadMember(currentPage)
			            return;
			        }

			        // 其他錯誤
			        const result = await response.json();
			        alert(result.message ?? "停用會員失敗");

			    } catch (error) {
			        console.error("停用會員發生錯誤：", error);
			        alert("系統發生錯誤，請稍後再試");
			    }
			}
	//恢復會員功能
		async function reactivateMember(accountid) {

		    if (!confirm("確定要恢復此會員嗎？")) {
		        return;
		    }
		    try {
		        const response = await fetch(
		            `/api/admin/members/${accountid}/reactivate`,
		            {
		                method: "PATCH"
		            }
		        );

		        if (response.status === 401) {
		            window.location.href = "/login.html";
		            return;
		        }

		        if (response.status === 403) {
		            alert("沒有權限");
		            return;
		        }

		        if (!response.ok) {
		            throw new Error("恢復會員失敗");
		        }

		        const result = await response.json();

		        alert(result.message);
		        loadMember(currentPage);

		    } catch (error) {
		        console.error(error);
		        alert("恢復會員時發生錯誤");
		    }
		}
	//編輯會員先取得原本的會員資料
	let editingMemberId = null; //先讓準備儲存的會員id為空，後面再植入變數
	async function editMember(memberid) {
		try {
	    const response = await fetch(
	        `/api/admin/members/${memberid}`
	    );

		if (response.status === 401) {
		    window.location.href = "/login";
		    return;
		}

		if (response.status === 403) {
		    alert("沒有權限");
		    return;
		}

		if (!response.ok) {
		    throw new Error("取得會員資料失敗");
		}

	    const member = await response.json();

	    // 保存目前正在編輯的會員
	    editingMemberId = memberid;

	    // 將資料填入編輯表單
	    document.getElementById("editUserName").value = member.username;
	    document.getElementById("editName").value = member.name;
	    document.getElementById("editPhone").value = member.phone;
	    document.getElementById("editEmail").value = member.email;

	    // 顯示編輯表單
	    document.getElementById("editMemberPanel").style.display = "block";
		
	} catch (error) {
		    console.error(error);
		    alert("無法取得會員資料");
		}
	}
	//儲存修改的會員
	document.getElementById("saveEdit")
	.addEventListener("click", async () => {

	    if (editingMemberId === null) return;

	    // 取得表單資料
	    const data = {
	        username: document.getElementById("editUserName").value.trim(),
	        name: document.getElementById("editName").value.trim(),
	        phone: document.getElementById("editPhone").value.trim(),
	        email: document.getElementById("editEmail").value.trim()
	    };

	    const errorElement = document.getElementById("editError");
	    errorElement.textContent = "";

	    try {
	        const response = await fetch(
	            `/api/admin/members/update/${editingMemberId}`,
	            {
	                method: "PUT",
	                headers: {
	                    "Content-Type": "application/json"
	                },
	                body: JSON.stringify(data) //編輯會員傳送的資料打包成Requestbody比較安全
	            }
	        );

	        if (response.status === 401) {
	            window.location.href = "/login";
	            return;
	        }

	        if (response.status === 403) {
	            errorElement.textContent = "沒有修改權限";
	            return;
	        }

	        const result = await response.json();

	        //更新成功
	        if (response.ok && result.success) { 
				//一個是HTTP的成功代碼另一個是DTO的驗證有沒有符合資料格式

	            alert("會員資料更新成功");

	            document.getElementById("editMemberPanel")
	                .style.display = "none";

	            editingMemberId = null;

	            // 重新載入會員列表
	            loadMember(currentPage);

	            return;
	        }

	        // DTO驗證失敗
	        if (result.errors) {

	            errorElement.textContent =
	                Object.values(result.errors).join("、");

	            return;
	        }

	        // 其他錯誤
	        errorElement.textContent =
	            result.message || "更新失敗";

	    } catch (error) {

	        console.error(error);
	        errorElement.textContent = "伺服器連線失敗";
	    }

	});
	
	//取消按鈕
	document.getElementById("cancelEdit")
	.addEventListener("click", () => {

	    document.getElementById("editMemberPanel")
	        .style.display = "none";

	    document.getElementById("editError").textContent = "";

	    editingMemberId = null;
	});
	
	let purchasingMemberId = null;
	let purchaseCourses = [];
	const PURCHASE_SESSIONS = 10;
	async function openPurchaseDialog(memberid, memberName) {

	    purchasingMemberId = memberid;

	    const dialog = document.getElementById("purchaseDialog");

	    // 顯示購課會員名稱
	    document.getElementById("purchaseMemberName")
	        .textContent = memberName;

	    // 重置上一筆資料
	    document.getElementById("purchaseCourse").innerHTML =
	        '<option value="">請選擇課程</option>';

	    document.getElementById("purchaseCoach").innerHTML =
	        '<option value="">請先選擇課程</option>';

	    document.getElementById("purchaseCoach").disabled = true;

	    document.getElementById("purchaseUnitPrice")
	        .textContent = "NT$ 0";

	    document.getElementById("purchaseTotalAmount")
	        .textContent = "NT$ 0";

	    document.getElementById("purchaseMessage")
	        .textContent = "";

	    document.getElementById("submitPurchaseBtn").disabled = true;

	    // 開啟彈窗
	    dialog.showModal();

	    // 載入可購買課程
	    await loadPurchaseCourses();
	}
	async function loadPurchaseCourses() {

	    const courseSelect =
	        document.getElementById("purchaseCourse");

	    const message =
	        document.getElementById("purchaseMessage");

	    try {

	        const response = await fetch(
	            "/api/admin/purchases/courses"
	        );

	        if (response.status === 401) {
	            window.location.href = "/login.html";
	            return;
	        }

	        if (response.status === 403) {
	            message.textContent = "沒有查詢課程的權限";
	            return;
	        }

	        if (!response.ok) {
	            throw new Error("取得課程失敗");
	        }

	        purchaseCourses = await response.json();

	        // 清空選單
	        courseSelect.innerHTML =
	            '<option value="">請選擇課程</option>';

	        // 根據 DTO 建立選項
	        purchaseCourses.forEach(course => {

	            const option = document.createElement("option");

	            option.value = course.courseid;
	            option.textContent = course.coursename;

	            courseSelect.appendChild(option);
	        });

	        if (purchaseCourses.length === 0) {
	            message.textContent = "目前沒有可購買的課程";
	        }

	    } catch (error) {

	        console.error("取得課程失敗：", error);

	        message.textContent = "載入課程失敗";
	    }
	}
	document.getElementById("purchaseCourse")
	.addEventListener("change", async function () {

	    const courseid = this.value;

	    const coachSelect =
	        document.getElementById("purchaseCoach");

	    const message =
	        document.getElementById("purchaseMessage");

	    const submitBtn =
	        document.getElementById("submitPurchaseBtn");

	    // 重置教練選單
	    coachSelect.innerHTML =
	        '<option value="">請選擇教練</option>';

	    coachSelect.disabled = true;
	    submitBtn.disabled = true;
	    message.textContent = "";

	    if (!courseid) {

	        document.getElementById("purchaseUnitPrice")
	            .textContent = "NT$ 0";

	        document.getElementById("purchaseTotalAmount")
	            .textContent = "NT$ 0";

	        return;
	    }

	    // 找出剛剛 GET 取得的課程
	    const selectedCourse = purchaseCourses.find(
	        course => String(course.courseid) === courseid
	    );

	    if (!selectedCourse) return;

	    // 顯示單堂價格
	    const price = Number(selectedCourse.price);

	    document.getElementById("purchaseUnitPrice")
	        .textContent = `NT$ ${price.toLocaleString("zh-TW")}`;

	    // 顯示10堂總金額
	    document.getElementById("purchaseTotalAmount")
	        .textContent =
	            `NT$ ${(price * PURCHASE_SESSIONS).toLocaleString("zh-TW")}`;

	    try {

	        const response = await fetch(
	            `/api/admin/purchases/courses/${courseid}/coaches`
	        );

	        if (response.status === 401) {
	            window.location.href = "/login.html";
	            return;
	        }

	        if (response.status === 403) {
	            message.textContent = "沒有查詢教練的權限";
	            return;
	        }

	        if (!response.ok) {
	            throw new Error("取得教練失敗");
	        }

	        const coaches = await response.json();

	        // 避免快速切換課程時，舊請求覆蓋新課程的教練
	        if (document.getElementById("purchaseCourse").value
	                !== courseid) {
	            return;
	        }

	        coaches.forEach(coach => {

	            const option = document.createElement("option");

	            option.value = coach.coachid;

	            // 因為之前有同名教練，附上ID方便區分
	            option.textContent =
	                `${coach.coachname}（：${coach.coachno}）`;

	            coachSelect.appendChild(option);
	        });

	        if (coaches.length === 0) {
	            message.textContent = "此課程目前沒有可授課教練";
	            return;
	        }

	        coachSelect.disabled = false;

	    } catch (error) {

	        console.error("取得教練失敗：", error);
	        message.textContent = "載入教練失敗";
	    }
	});
	//有選擇教練才可以送出
	document.getElementById("purchaseCoach")
	.addEventListener("change", function () {

	    document.getElementById("submitPurchaseBtn").disabled =
	        !this.value;
	});
	document.getElementById("submitPurchaseBtn")
	.addEventListener("click", async function () {

	    if (purchasingMemberId === null) return;

	    const courseid =
	        document.getElementById("purchaseCourse").value;

	    const coachid =
	        document.getElementById("purchaseCoach").value;

	    const message =
	        document.getElementById("purchaseMessage");

	    if (!courseid || !coachid) {
	        message.textContent = "請選擇課程與教練";
	        return;
	    }

	    if (!confirm("確定要新增這筆購課紀錄嗎？")) {
	        return;
	    }

	    // 防止重複點擊
	    this.disabled = true;
	    message.textContent = "";

	    try {

	        const response = await fetch(
	            `/api/admin/purchases/${purchasingMemberId}/purchases`,
	            {
	                method: "POST",
	                headers: {
	                    "Content-Type": "application/json"
	                },
	                body: JSON.stringify({
	                    courseid: Number(courseid),
	                    coachid: Number(coachid)
	                })
	            }
	        );

	        if (response.status === 401) {
	            window.location.href = "/login.html";
	            return;
	        }

	        if (response.status === 403) {
	            message.textContent = "沒有新增購課的權限";
	            return;
	        }

	        const result = await response.json();

	        // 新增成功
	        if (response.ok && result.success) {

	            alert("購課成功");

	            document.getElementById("purchaseDialog").close();

	            purchasingMemberId = null;

	            // 重新取得會員列表
	            loadMember(currentPage);

	            return;
	        }

	        // DTO或業務驗證錯誤
	        if (result.errors) {
	            message.textContent =
	                Object.values(result.errors).join("、");
	        } else {
	            message.textContent =
	                result.message || "新增購課失敗";
	        }

	    } catch (error) {

	        console.error("新增購課失敗：", error);

	        message.textContent = "伺服器連線失敗";

	    } finally {

	        // 失敗時允許再次送出
	        this.disabled = false;
	    }
	});
	document.getElementById("closePurchaseBtn")
	.addEventListener("click", () => {

	    document.getElementById("purchaseDialog").close();

	    purchasingMemberId = null;
	});
	document.getElementById("purchaseDialog")
	.addEventListener("close", () => {
	    purchasingMemberId = null;
	});
		</script>
		
	</body>
</html>
