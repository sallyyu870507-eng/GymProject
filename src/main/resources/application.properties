spring.application.name=gymproject

# SQL Server：本機、固定連接埠 1433、Windows 驗證
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=gymproject;integratedSecurity=true;encrypt=true;trustServerCertificate=true

# 使用現有資料表，不自動建立或修改結構
spring.jpa.hibernate.ddl-auto=none

# 在 Console 顯示 SQL
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# 保留 Entity 指定的資料表、欄位命名
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# 文字編碼
spring.servlet.encoding.charset=UTF-8

# 檔案上傳設定
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=16MB
spring.servlet.multipart.max-request-size=64MB
file.upload.dir=src/main/resources/static/upload/

# Session 閒置逾時時間
server.servlet.session.timeout=30m