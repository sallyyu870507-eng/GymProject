spring.application.name=gymproject

# SQL Server：本機、固定連接埠 1433、Windows 驗證
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=gymproject;integratedSecurity=true;encrypt=true;trustServerCertificate=true

# 使用現有資料表，暫時不讓 JPA 自動建立或修改資料表
spring.jpa.hibernate.ddl-auto=none

# 在 Console 顯示 SQL，方便開發時確認
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false